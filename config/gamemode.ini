[general]
; amd-pstate-epp already boosts fine under "powersave", so the governor switch
; is a no-op here -- and renice/softrealtime need privileges gamemode does not
; have on this box, so both are left off to keep `gamemoded -t` clean. The
; value of gamemode here is the hooks below.
inhibit_screensaver=1
; Match the amd-pstate-epp governor so gamemode stops trying to switch it
; (and stops reporting a failure it cannot fix).
desiredgov=powersave
defaultgov=powersave

[custom]
; Free the GPU before a game starts. A 16GB card cannot hold a resident LLM
; and a 3440x1440 game at once; when it runs out, amdgpu resets the ring
; rather than failing gracefully -- which is the "GPU shits itself" symptom.
; gamemode does not expand ~ or $HOME here, so this path has to be absolute --
; change "yourusername" to your own.
;
; Two commands per hook: gamemode runs each through the shell, and continuation
; lines (leading whitespace) are how its ini format takes more than one -- see
; the [custom] example in gamemoded(8).
;
; The second one silences notifications for the duration of the game.
; swaync inhibitors are named, so this cannot get out of sync with itself the
; way a do-not-disturb toggle would: the "end" hook removes this exact one and
; leaves any other inhibitor alone. If you run mako instead of swaync, drop
; both swaync-client lines -- mako has no equivalent, and gamemode will just
; log a "command not found" every time you start a game.
start=/home/yourusername/.local/bin/llm-vram-release
    swaync-client -Ia gamemode -sw
; Ollama needs nothing restored -- it reloads a model on the next request by
; itself -- so the end hook exists only to lift the inhibitor.
end=swaync-client -Ir gamemode -sw
