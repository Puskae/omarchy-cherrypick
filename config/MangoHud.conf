# Enabled globally via MANGOHUD=1, but hidden until toggled, so ordinary GL
# apps (Firefox, the file manager) don't get an FPS counter stapled to them.
no_display

toggle_hud=Shift_R+F12

fps
frametime
frame_timing=1
gpu_stats
gpu_temp
cpu_stats
cpu_temp
ram
vram
vsync
gpu_name

position=top-left
font_size=20
background_alpha=0.4
round_corners=6
