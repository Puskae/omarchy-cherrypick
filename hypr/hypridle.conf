# Desktop machine: no battery and no backlight, so there is no dim-then-sleep
# ladder here -- just lock, then blank the displays.
#
# Every hyprctl call below uses the *Lua* dispatcher form. Hyprland 0.56 parses
# the argument as Lua, so the old `hyprctl dispatch dpms off` is a syntax error
# ("')' expected near 'off'") -- and hypridle does not check the exit code or
# print anything, so a broken timeout looks exactly like a screen that simply
# never sleeps. Verify a change with `hyprctl monitors -j | grep dpmsStatus`,
# not by waiting fifteen minutes.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ mode = "on" })'
}

listener {
    timeout = 600                              # 10 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900                              # 15 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ mode = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ mode = "on" })'
}
