# Background is a blurred grab of the screen itself, so this stays correct
# whichever Omarchy theme is active -- no colors to regenerate.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(216, 222, 233)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    check_color = rgb(129, 161, 193)
    fail_text = <i>Wrong password ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    font_size = 60
    font_family = MesloLGM Nerd Font
    color = rgb(216, 222, 233)
    position = 0, 80
    halign = center
    valign = center
}
